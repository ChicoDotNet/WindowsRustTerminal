[workspace]
resolver = "3"
members = [
    "rust/terminal-input",
    "rust/terminal-parser",
    "rust/terminal-parser-ffi",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ChicoDotNet/terminal"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
