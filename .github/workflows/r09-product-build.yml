name: R09 Product Build

on:
  push:
    branches:
      - "rust/r09-product-integration"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/terminal-parser/**"
      - "rust/terminal-parser-ffi/**"
      - "rust/terminal-app/**"
      - "rust/terminal-app-ffi/**"
      - "src/terminal/parser/**"
      - "src/cascadia/fzf/**"
      - "src/cascadia/TerminalApp/**"
      - "src/cascadia/TerminalSettingsEditor/**"
      - "Directory.Build.targets"
      - "tools/rust/Invoke-R09ProductBuild.ps1"
      - "tools/rust/Invoke-R09OutputEscProductSwap.ps1"
      - "tools/rust/R09ControlCharacterAbiProbe.cpp"
      - "tools/rust/Test-R09ParserOwnership.ps1"
      - "tools/rust/Test-R09OutputOwnership.ps1"
      - "tools/rust/Test-R09FzfOwnership.ps1"
      - ".github/workflows/r09-product-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r09-product-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cascadia-package:
    name: CascadiaPackage x64 Debug
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Rust toolchain
        run: rustup show
      - name: Prepare Output ESC Rust ownership candidate
        if: contains(github.event.head_commit.message, 'Promote Output ESC product ownership')
        shell: pwsh
        run: ./tools/rust/Invoke-R09OutputEscProductSwap.ps1
      - name: Preserve Output ESC ownership candidate
        if: contains(github.event.head_commit.message, 'Promote Output ESC product ownership')
        uses: actions/upload-artifact@v4
        with:
          name: r09-output-esc-product-swap-source
          path: src/terminal/parser/OutputStateMachineEngine.cpp
          if-no-files-found: error
          retention-days: 1
      - name: Validate parser ownership promotion
        shell: pwsh
        run: ./tools/rust/Test-R09ParserOwnership.ps1
      - name: Validate Output ownership promotion
        shell: pwsh
        run: ./tools/rust/Test-R09OutputOwnership.ps1
      - name: Validate FZF ownership promotion
        shell: pwsh
        run: ./tools/rust/Test-R09FzfOwnership.ps1
      - name: Canonical product build
        shell: pwsh
        run: ./tools/rust/Invoke-R09ProductBuild.ps1 -Configuration Debug -Platform x64 -SkipSubmodules
      - name: Promote verified Output ESC Rust ownership
        if: contains(github.event.head_commit.message, 'Promote Output ESC product ownership')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = 'rust/r09-product-integration'
          $source = 'src/terminal/parser/OutputStateMachineEngine.cpp'
          $workflow = '.github/workflows/r09-product-build.yml'
          $expectedBlob = '2f0f6f28dafd9f9048074f84dbf05249c3e56884'

          $actualBlob = (git hash-object -- $source).Trim()
          if ($actualBlob -ne $expectedBlob)
          {
              throw "Output ESC candidate blob drifted: expected $expectedBlob, got $actualBlob"
          }

          git fetch --no-tags origin "refs/heads/$branch"
          $remoteHead = (git rev-parse FETCH_HEAD).Trim()
          if ($remoteHead -ne '${{ github.sha }}')
          {
              throw "Remote branch advanced to $remoteHead; refusing to overwrite concurrent work."
          }

          git checkout '${{ github.sha }}^' -- $workflow

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $source $workflow

          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 2 -or $staged -notcontains $source -or $staged -notcontains $workflow)
          {
              throw "Promotion staged unexpected paths: $($staged -join ', ')"
          }

          git commit -m 'Route Output ESC actions through Rust'

          git fetch --no-tags origin "refs/heads/$branch"
          $remoteHead = (git rev-parse FETCH_HEAD).Trim()
          if ($remoteHead -ne '${{ github.sha }}')
          {
              throw "Remote branch advanced to $remoteHead before push; refusing to overwrite concurrent work."
          }

          git push origin "HEAD:$branch"
      - name: Preserve product build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r09-product-build-diagnostics
          path: |
            artifacts/r09-product-build.log
            artifacts/r09-product-build.binlog
          if-no-files-found: warn
          retention-days: 7
