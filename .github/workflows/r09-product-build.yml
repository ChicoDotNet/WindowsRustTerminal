name: R09 Product Build

on:
  push:
    branches:
      - "rust/r09-product-integration"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/terminal-parser/**"
      - "rust/terminal-parser-ffi/**"
      - "rust/terminal-app/**"
      - "rust/terminal-app-ffi/**"
      - "src/terminal/parser/**"
      - "src/cascadia/fzf/**"
      - "src/cascadia/TerminalApp/**"
      - "src/cascadia/TerminalSettingsEditor/**"
      - "Directory.Build.targets"
      - "tools/rust/Invoke-R09ProductBuild.ps1"
      - "tools/rust/R09ControlCharacterAbiProbe.cpp"
      - "tools/rust/R09OutputCsiColumnAbiProbe.hpp"
      - "tools/rust/R09OutputCsiDecfraAbiProbe.hpp"
      - "tools/rust/R09OutputCsiDecsaceAbiProbe.hpp"
      - "tools/rust/R09OutputCsiDecinvmAbiProbe.hpp"
      - "tools/rust/R09OutputCsiDecacAbiProbe.hpp"
      - "tools/rust/R09OutputCsiDecrqtsrAbiProbe.hpp"
      - "tools/rust/R09OutputCsiRectAttributesAbiProbe.hpp"
      - "tools/rust/R09OutputCsiKittyKeyboardQueryAbiProbe.hpp"
      - "tools/rust/R09OutputCsiKittyKeyboardPushAbiProbe.hpp"
      - "tools/rust/R09OutputCsiKittyKeyboardPopAbiProbe.hpp"
      - "tools/rust/R09OutputCsiKittyKeyboardSetAbiProbe.hpp"
      - "tools/rust/R09OutputCsiPushSgrAbiProbe.hpp"
      - "tools/rust/R09OutputCsiRectCopyAbiProbe.hpp"
      - "tools/rust/R09OutputCsiRectEraseAbiProbe.hpp"
      - "tools/rust/R09OutputCsiRequestPresentationStateAbiProbe.hpp"
      - "tools/rust/R09OutputCsiSgrAbiProbe.hpp"
      - "tools/rust/R09OutputCsiUserPreferenceCharsetAbiProbe.hpp"
      - "tools/rust/Test-R09ParserOwnership.ps1"
      - "tools/rust/Test-R09OutputOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiEraseCharactersOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiScrollOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiPageOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiPagePositionOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiTabOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiTerminalParametersOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiDeviceAttributesOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiCursorRestoreOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiSoftResetOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiDisplayedExtentOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiCursorStyleOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiRequestModeOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiDeviceStatusReportOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiModeOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiEraseOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiTabControlOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiWindowManipulationOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiPopSgrOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiDecscaOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiPushSgrOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiSgrOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiDecfraOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiColumnOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiRectEraseOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiRectCopyOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiUserPreferenceCharsetOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiKittyKeyboardQueryOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiKittyKeyboardPushOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiKittyKeyboardPopOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiKittyKeyboardSetOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiRequestPresentationStateOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiDecsaceOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiDecinvmOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiDecacOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiDecrqtsrOwnership.ps1"
      - "tools/rust/Test-R09OutputCsiRectAttributesOwnership.ps1"
      - "tools/rust/Test-R09FzfOwnership.ps1"
      - ".github/workflows/r09-product-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r09-product-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cascadia-package:
    name: CascadiaPackage x64 Debug
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup show
      - name: Validate parser ownership
        shell: pwsh
        run: ./tools/rust/Test-R09ParserOwnership.ps1
      - name: Validate Output ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputOwnership.ps1
      - name: Validate CSI erase characters ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiEraseCharactersOwnership.ps1
      - name: Validate CSI scrolling ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiScrollOwnership.ps1
      - name: Validate CSI page navigation ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiPageOwnership.ps1
      - name: Validate CSI page positioning ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiPagePositionOwnership.ps1
      - name: Validate CSI tab movement ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiTabOwnership.ps1
      - name: Validate CSI terminal parameters ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiTerminalParametersOwnership.ps1
      - name: Validate CSI device attributes ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiDeviceAttributesOwnership.ps1
      - name: Validate CSI cursor restore ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiCursorRestoreOwnership.ps1
      - name: Validate CSI soft reset ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiSoftResetOwnership.ps1
      - name: Validate CSI displayed extent ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiDisplayedExtentOwnership.ps1
      - name: Validate CSI cursor style ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiCursorStyleOwnership.ps1
      - name: Validate CSI request mode ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiRequestModeOwnership.ps1
      - name: Validate CSI device status report ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiDeviceStatusReportOwnership.ps1
      - name: Validate CSI mode ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiModeOwnership.ps1
      - name: Validate CSI erase ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiEraseOwnership.ps1
      - name: Validate CSI tab control ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiTabControlOwnership.ps1
      - name: Validate CSI window manipulation ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiWindowManipulationOwnership.ps1
      - name: Validate CSI pop SGR ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiPopSgrOwnership.ps1
      - name: Validate CSI DECSCA ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiDecscaOwnership.ps1
      - name: Validate CSI push SGR ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiPushSgrOwnership.ps1
      - name: Validate CSI SGR ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiSgrOwnership.ps1
      - name: Validate CSI DECFRA ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiDecfraOwnership.ps1
      - name: Validate CSI column ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiColumnOwnership.ps1
      - name: Validate CSI rectangular erase ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiRectEraseOwnership.ps1
      - name: Validate CSI rectangular copy ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiRectCopyOwnership.ps1
      - name: Validate CSI user preference charset ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiUserPreferenceCharsetOwnership.ps1
      - name: Validate CSI Kitty keyboard query ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiKittyKeyboardQueryOwnership.ps1
      - name: Validate CSI Kitty keyboard push ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiKittyKeyboardPushOwnership.ps1
      - name: Validate CSI Kitty keyboard pop ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiKittyKeyboardPopOwnership.ps1
      - name: Validate CSI Kitty keyboard set ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiKittyKeyboardSetOwnership.ps1
      - name: Validate CSI presentation state request ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiRequestPresentationStateOwnership.ps1
      - name: Validate CSI DECSACE ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiDecsaceOwnership.ps1
      - name: Validate CSI DECINVM ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiDecinvmOwnership.ps1
      - name: Validate CSI DECAC ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiDecacOwnership.ps1
      - name: Validate CSI DECRQTSR ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiDecrqtsrOwnership.ps1
      - name: Validate CSI rectangular attributes ownership
        shell: pwsh
        run: ./tools/rust/Test-R09OutputCsiRectAttributesOwnership.ps1
      - name: Validate FZF ownership
        shell: pwsh
        run: ./tools/rust/Test-R09FzfOwnership.ps1
      - name: Canonical product build
        shell: pwsh
        run: ./tools/rust/Invoke-R09ProductBuild.ps1 -Configuration Debug -Platform x64 -SkipSubmodules
      - name: Preserve product build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r09-product-build-diagnostics
          path: |
            artifacts/r09-product-build.log
            artifacts/r09-product-build.binlog
          if-no-files-found: warn
          retention-days: 7
