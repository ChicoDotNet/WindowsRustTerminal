name: R09 Product Build

on:
  push:
    branches:
      - "rust/r09-product-integration"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/terminal-parser/**"
      - "rust/terminal-parser-ffi/**"
      - "rust/terminal-app/**"
      - "rust/terminal-app-ffi/**"
      - "src/terminal/parser/**"
      - "src/cascadia/fzf/**"
      - "src/cascadia/TerminalApp/**"
      - "src/cascadia/TerminalSettingsEditor/**"
      - "Directory.Build.targets"
      - "tools/rust/Invoke-R09ProductBuild.ps1"
      - "tools/rust/R09ControlCharacterAbiProbe.cpp"
      - "tools/rust/Test-R09ParserOwnership.ps1"
      - "tools/rust/Test-R09OutputOwnership.ps1"
      - "tools/rust/Test-R09FzfOwnership.ps1"
      - "tools/rust/Promote-R09OutputVt52.ps1"
      - ".github/workflows/r09-product-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r09-product-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cascadia-package:
    name: CascadiaPackage x64 Debug
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup show
      - name: Prepare Output VT52 Rust ownership candidate
        shell: pwsh
        run: ./tools/rust/Promote-R09OutputVt52.ps1
      - name: Validate parser ownership promotion
        shell: pwsh
        run: ./tools/rust/Test-R09ParserOwnership.ps1
      - name: Validate Output ownership promotion
        shell: pwsh
        run: ./tools/rust/Test-R09OutputOwnership.ps1
      - name: Validate FZF ownership promotion
        shell: pwsh
        run: ./tools/rust/Test-R09FzfOwnership.ps1
      - name: Canonical product build
        shell: pwsh
        run: ./tools/rust/Invoke-R09ProductBuild.ps1 -Configuration Debug -Platform x64 -SkipSubmodules
      - name: Promote verified Output VT52 Rust ownership
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --short -- src/terminal/parser/OutputStateMachineEngine.cpp)) {
              Write-Host 'No VT52 promotion delta remains.'
              exit 0
          }
          git fetch origin rust/r09-product-integration
          $remoteHead = git rev-parse origin/rust/r09-product-integration
          if ($remoteHead -ne $env:EXPECTED_HEAD) {
              throw "Concurrent branch update detected: expected $env:EXPECTED_HEAD, found $remoteHead."
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/terminal/parser/OutputStateMachineEngine.cpp
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 1 -or $staged[0] -ne 'src/terminal/parser/OutputStateMachineEngine.cpp') {
              throw "Unexpected staged files: $($staged -join ', ')"
          }
          git commit -m 'Route Output VT52 actions through Rust'
          git push origin HEAD:rust/r09-product-integration
      - name: Preserve product build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r09-product-build-diagnostics
          path: |
            artifacts/r09-product-build.log
            artifacts/r09-product-build.binlog
          if-no-files-found: warn
          retention-days: 7