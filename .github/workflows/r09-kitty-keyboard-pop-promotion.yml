name: R09 Kitty Keyboard Pop Promotion

on:
  push:
    branches:
      - "rust/r09-product-integration"
    paths:
      - "tools/rust/Invoke-R09CsiKittyKeyboardPopProductSwap.ps1"
      - ".github/workflows/r09-kitty-keyboard-pop-promotion.yml"

permissions:
  contents: write

concurrency:
  group: r09-kitty-keyboard-pop-promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    name: Verify and promote Kitty keyboard pop
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup show
      - name: Prepare Kitty keyboard pop Rust ownership candidate
        shell: pwsh
        run: ./tools/rust/Invoke-R09CsiKittyKeyboardPopProductSwap.ps1
      - name: Validate candidate diff
        shell: pwsh
        run: |
          git diff --check -- src/terminal/parser/OutputStateMachineEngine.cpp
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'src/terminal/parser/OutputStateMachineEngine.cpp')
          {
              throw "Candidate changed unexpected paths: $($changed -join ', ')"
          }
      - name: Canonical product build
        shell: pwsh
        run: ./tools/rust/Invoke-R09ProductBuild.ps1 -Configuration Debug -Platform x64 -SkipSubmodules
      - name: Promote verified Kitty keyboard pop Rust ownership
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = 'rust/r09-product-integration'
          $source = 'src/terminal/parser/OutputStateMachineEngine.cpp'

          git fetch --no-tags origin "refs/heads/$branch"
          $remoteHead = (git rev-parse FETCH_HEAD).Trim()
          if ($remoteHead -ne '${{ github.sha }}')
          {
              throw "Remote branch advanced to $remoteHead; refusing to overwrite concurrent work."
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $source

          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 1 -or $staged[0] -ne $source)
          {
              throw "Promotion staged unexpected paths: $($staged -join ', ')"
          }

          git commit -m 'Route CSI Kitty keyboard pop through Rust'

          git fetch --no-tags origin "refs/heads/$branch"
          $remoteHead = (git rev-parse FETCH_HEAD).Trim()
          if ($remoteHead -ne '${{ github.sha }}')
          {
              throw "Remote branch advanced to $remoteHead before push; refusing to overwrite concurrent work."
          }

          git push origin "HEAD:$branch"
      - name: Preserve product build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r09-kitty-keyboard-pop-promotion-diagnostics
          path: |
            artifacts/r09-product-build.log
            artifacts/r09-product-build.binlog
          if-no-files-found: warn
          retention-days: 7
