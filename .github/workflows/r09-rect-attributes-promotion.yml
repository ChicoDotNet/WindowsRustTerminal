name: R09 Promote Rectangular Attributes

on:
  push:
    branches:
      - rust/r09-product-integration
    paths:
      - tools/rust/Invoke-R09RectAttributesProductSwap.ps1
      - .github/workflows/r09-rect-attributes-promotion.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r09-rect-attributes-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Route DECCARA and DECRARA through Rust
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout candidate base
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Rust toolchain
        run: rustup show

      - name: Verify remote branch has not moved
        shell: pwsh
        run: |
          $expected = '${{ github.sha }}'
          $remote = (git ls-remote origin 'refs/heads/rust/r09-product-integration').Split("`t")[0]
          if ($remote -ne $expected) {
            throw "Remote branch moved before promotion. Expected $expected, found $remote."
          }

      - name: Prepare Rust ownership candidate
        shell: pwsh
        run: .\tools\rust\Invoke-R09RectAttributesProductSwap.ps1

      - name: Validate candidate diff
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

          $engine = Get-Content -Raw 'src\terminal\parser\OutputStateMachineEngine.cpp'
          foreach ($required in @(
            'terminal_parser_ffi_output_csi_rect_attributes_plan(',
            'TERMINAL_PARSER_FFI_OUTPUT_CSI_RECT_ATTRIBUTES_CHANGE',
            'TERMINAL_PARSER_FFI_OUTPUT_CSI_RECT_ATTRIBUTES_REVERSE',
            'parameters.at(0),',
            'parameters.at(1),',
            'rectAttributesPlan.bottom,',
            'rectAttributesPlan.right,',
            'parameters.subspan(4));'
          )) {
            if (-not $engine.Contains($required)) { throw "Missing routed marker: $required" }
          }
          foreach ($legacy in @(
            'case CsiActionCodes::DECCARA_ChangeAttributesRectangularArea:',
            'case CsiActionCodes::DECRARA_ReverseAttributesRectangularArea:'
          )) {
            if ($engine.Contains($legacy)) { throw "Legacy ownership remains: $legacy" }
          }

          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'src/terminal/parser/OutputStateMachineEngine.cpp') {
            throw "Promotion candidate changed unexpected files: $($changed -join ', ')"
          }

      - name: Commit ownership route locally
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'src/terminal/parser/OutputStateMachineEngine.cpp'
          git commit -m 'Route rectangular attributes through Rust'

      - name: Canonical product build
        shell: pwsh
        run: .\tools\rust\Invoke-R09ProductBuild.ps1 -Configuration Debug -Platform x64 -SkipSubmodules

      - name: Preserve product build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r09-rect-attributes-promotion-diagnostics
          path: |
            artifacts/r09-product-build.log
            artifacts/r09-product-build.binlog
          if-no-files-found: warn
          retention-days: 7

      - name: Verify remote branch still has not moved
        shell: pwsh
        run: |
          $expected = '${{ github.sha }}'
          $remote = (git ls-remote origin 'refs/heads/rust/r09-product-integration').Split("`t")[0]
          if ($remote -ne $expected) {
            throw "Remote branch moved during product certification. Expected $expected, found $remote."
          }

      - name: Publish certified ownership route
        shell: pwsh
        run: git push origin HEAD:rust/r09-product-integration
