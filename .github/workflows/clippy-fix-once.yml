name: R08 clippy fix once

on:
  push:
    branches:
      - "ci/r08-clippy-fix-once"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clippy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci/r08-clippy-fix-once
      - name: Toolchain
        run: rustup show
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Apply Clippy automatic fixes
        shell: bash
        run: cargo clippy --fix --workspace --all-targets --locked --allow-dirty --allow-staged -- -D warnings || true
      - name: Apply deterministic non-machine-applicable lint fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("rust/terminal-foundation/src/types_utils.rs")
          text = path.read_text(encoding="utf-8")
          old = (
              "    i16::try_from(value.clamp(i32::from(minimum), i32::from(i16::MAX)))\n"
              "        .expect(\"value was clamped to the i16 range\")\n"
          )
          new = "    value.clamp(i32::from(minimum), i32::from(i16::MAX)) as i16\n"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Reformat fixed sources
        run: cargo fmt --all
      - name: Commit mechanical fixes before verification
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Clippy produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: persist strict clippy fixes"
          git push origin HEAD:ci/r08-clippy-fix-once
      - name: Verify Clippy strictly
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
