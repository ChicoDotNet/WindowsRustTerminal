name: R09 Commandline Route Materializer

on:
  push:
    branches: [rust/r09-product-integration]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Materialize guarded route
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin rust/r09-product-integration
          test "$(git rev-parse origin/rust/r09-product-integration)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          path = Path("src/cascadia/TerminalSettingsModel/CascadiaSettingsSerialization.cpp")
          data = path.read_bytes()
          eol = b"\r\n"
          if eol not in data or b"\n" in data.replace(eol, b""):
              raise SystemExit("expected CRLF-only source before route")
          include_old = b'#include "WtExeUtils.h"' + eol + eol
          include_new = b'#include "WtExeUtils.h"' + eol + b'#include "terminal_settings_ffi.h"' + eol + eol
          if data.count(include_old) != 1:
              raise SystemExit("FFI include anchor must match exactly once")
          data = data.replace(include_old, include_new, 1)
          policy_start = data.find(b"    struct CommandlinePatch" + eol)
          policy_end_marker = b"    static constexpr std::array iconsToClearFromVisualStudioProfiles{"
          policy_end = data.find(policy_end_marker, policy_start)
          if policy_start < 0 or policy_end < 0 or data.find(b"    struct CommandlinePatch" + eol, policy_start + 1) >= 0:
              raise SystemExit("legacy policy table anchors are ambiguous")
          policy = data[policy_start:policy_end]
          for witness in (b"commandlinePatches", b"cmd.exe", b"powershell.exe"):
              if witness not in policy:
                  raise SystemExit(f"legacy policy witness missing: {witness!r}")
          data = data[:policy_start] + data[policy_end:]
          route_start_marker = b"        if (profile->HasCommandline())" + eol
          route_end_marker = eol + eol + b"        if (profile->HasIcon()"
          route_start = data.find(route_start_marker)
          route_end = data.find(route_end_marker, route_start)
          if route_start < 0 or route_end < 0 or data.find(route_start_marker, route_start + 1) >= 0:
              raise SystemExit("legacy product route anchors are ambiguous")
          old_route = data[route_start:route_end]
          for witness in (b"commandlinePatches", b"til::equals_insensitive_ascii", b"profile->ClearCommandline()"):
              if witness not in old_route:
                  raise SystemExit(f"legacy route witness missing: {witness!r}")
          lines = [
              "        if (profile->HasCommandline())",
              "        {",
              "            const auto guid = profile->Guid();",
              "            const auto guidString = winrt::to_hstring(guid);",
              "            const auto explicitCommandline = profile->Commandline();",
              "            const auto guidUtf16 = reinterpret_cast<const uint16_t*>(guidString.c_str());",
              "            const auto explicitUtf16 = reinterpret_cast<const uint16_t*>(explicitCommandline.c_str());",
              "",
              "            uint8_t candidate{};",
              "            const auto candidateStatus = terminal_settings_ffi_commandline_fixup_candidate(",
              "                guidUtf16,",
              "                guidString.size(),",
              "                explicitUtf16,",
              "                explicitCommandline.size(),",
              "                &candidate);",
              "            if (candidateStatus == TERMINAL_SETTINGS_FFI_OK && candidate == 1)",
              "            {",
              "                profile->ClearCommandline();",
              "                const auto inheritedCommandline = profile->Commandline();",
              "                const auto inheritedUtf16 = reinterpret_cast<const uint16_t*>(inheritedCommandline.c_str());",
              "",
              "                uint32_t plan{};",
              "                const auto planStatus = terminal_settings_ffi_commandline_fixup_plan(",
              "                    guidUtf16,",
              "                    guidString.size(),",
              "                    explicitUtf16,",
              "                    explicitCommandline.size(),",
              "                    inheritedUtf16,",
              "                    inheritedCommandline.size(),",
              "                    &plan);",
              "                if (planStatus != TERMINAL_SETTINGS_FFI_OK)",
              "                {",
              "                    profile->Commandline(explicitCommandline);",
              "                }",
              "                else",
              "                {",
              "                    switch (plan)",
              "                    {",
              "                    case TERMINAL_SETTINGS_FFI_COMMANDLINE_FIXUP_CLEAR_OVERRIDE:",
              "                        fixedUp = true;",
              "                        break;",
              "                    case TERMINAL_SETTINGS_FFI_COMMANDLINE_FIXUP_RESTORE_CMD_FULL_PATH:",
              "                    case TERMINAL_SETTINGS_FFI_COMMANDLINE_FIXUP_RESTORE_POWERSHELL_FULL_PATH:",
              "                        if (const auto inboxProfile = inboxSettings.profilesByGuid.find(guid);",
              "                            inboxProfile != inboxSettings.profilesByGuid.end() && inboxProfile->second->HasCommandline())",
              "                        {",
              "                            profile->Commandline(inboxProfile->second->Commandline());",
              "                            fixedUp = true;",
              "                        }",
              "                        else",
              "                        {",
              "                            profile->Commandline(explicitCommandline);",
              "                        }",
              "                        break;",
              "                    default:",
              "                        profile->Commandline(explicitCommandline);",
              "                        break;",
              "                    }",
              "                }",
              "            }",
              "        }",
          ]
          new_route = eol.join(line.encode() for line in lines)
          data = data[:route_start] + new_route + data[route_end:]
          for forbidden in (b"struct CommandlinePatch", b"commandlinePatches", b"til::equals_insensitive_ascii(profile->Commandline()"):
              if forbidden in data:
                  raise SystemExit(f"legacy commandline policy remains: {forbidden!r}")
          if b"\n" in data.replace(eol, b""):
              raise SystemExit("route introduced non-CRLF newlines")
          path.write_bytes(data)
          PY
          pwsh -File ./tools/rust/Test-R09CommandlineFixupOwnership.ps1
          git diff --check
          git add src/cascadia/TerminalSettingsModel/CascadiaSettingsSerialization.cpp
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Route commandline fixup through Rust"
          git fetch origin rust/r09-product-integration
          test "$(git rev-parse origin/rust/r09-product-integration)" = "$GITHUB_SHA"
          git push origin HEAD:rust/r09-product-integration
