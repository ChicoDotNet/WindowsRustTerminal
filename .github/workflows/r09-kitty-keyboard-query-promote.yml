name: R09 Kitty keyboard query promotion

on:
  push:
    branches:
      - rust/r09-product-integration
    paths:
      - .github/workflows/r09-kitty-keyboard-query-promote.yml
      - tools/rust/r09-promote-output-csi-kitty-keyboard-query.py

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify remote head is unchanged
        shell: pwsh
        run: |
          git fetch origin rust/r09-product-integration
          $remote = (git rev-parse origin/rust/r09-product-integration).Trim()
          if ($remote -ne '${{ github.sha }}') {
            throw "Concurrent branch advance detected: $remote"
          }

      - name: Promote Kitty keyboard query Rust ownership
        shell: pwsh
        run: |
          python tools/rust/r09-promote-output-csi-kitty-keyboard-query.py
          git diff --check
          $source = Get-Content src/terminal/parser/OutputStateMachineEngine.cpp -Raw
          if ($source -match 'case CsiActionCodes::KKP_KittyKeyboardQuery:') {
            throw 'Legacy Kitty keyboard query case remains'
          }
          if ($source -notmatch 'terminal_parser_ffi_output_csi_kitty_keyboard_query_plan') {
            throw 'Rust Kitty keyboard query owner is not wired into product source'
          }

      - name: Commit promoted ownership
        shell: pwsh
        run: |
          git fetch origin rust/r09-product-integration
          $remote = (git rev-parse origin/rust/r09-product-integration).Trim()
          if ($remote -ne '${{ github.sha }}') {
            throw "Concurrent branch advance detected before commit: $remote"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/terminal/parser/OutputStateMachineEngine.cpp
          git diff --cached --quiet && throw 'No ownership change staged'
          git commit -m 'Route CSI Kitty keyboard query through Rust'
          git fetch origin rust/r09-product-integration
          $remote = (git rev-parse origin/rust/r09-product-integration).Trim()
          if ($remote -ne '${{ github.sha }}') {
            throw "Concurrent branch advance detected before push: $remote"
          }
          git push origin HEAD:rust/r09-product-integration
