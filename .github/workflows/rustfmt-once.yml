name: R08 rustfmt once

on:
  push:
    branches:
      - "ci/r08-rustfmt-once"

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci/r08-rustfmt-once
      - name: Toolchain
        run: rustup show
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "rustfmt produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply rustfmt once [skip ci]"
          git push origin HEAD:ci/r08-rustfmt-once
