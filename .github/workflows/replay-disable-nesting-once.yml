name: Replay disable-nesting once

on:
  push:
    branches:
      - dev/migrie/ci-suggestions-nesting-contract-replay

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/migrie/ci-suggestions-nesting-contract-replay
          fetch-depth: 0

      - name: Apply current-architecture transform
        run: python .github/scripts/replay_disable_nesting.py

      - name: Commit transformed contract and remove replay machinery
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/replay-disable-nesting-once.yml
          git rm .github/scripts/replay_disable_nesting.py
          git config user.name "WindowsRustTerminal Contract Replay"
          git config user.email "actions@users.noreply.github.com"
          git add src/cascadia/TerminalSettingsModel/ActionArgs.idl
          git add src/cascadia/TerminalSettingsModel/ActionArgs.h
          git add src/cascadia/TerminalSettingsModel/ActionMap.h
          git add src/cascadia/TerminalSettingsModel/ActionMap.idl
          git add src/cascadia/TerminalSettingsModel/TerminalSettingsSerializationHelpers.h
          git add src/cascadia/TerminalSettingsModel/ActionMap.cpp
          git add src/cascadia/TerminalApp/AppActionHandlers.cpp
          git add src/cascadia/TerminalApp/SnippetsPaneContent.cpp
          git commit -m "[disable-nesting-replay-applied] TRANSFORM historical suggestions nesting contract"
          git push origin HEAD:dev/migrie/ci-suggestions-nesting-contract-replay
