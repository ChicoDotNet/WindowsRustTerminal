name: R09 Promote CSI Report and Color

on:
  push:
    branches:
      - rust/r09-product-integration
    paths:
      - tools/rust/Invoke-R09CsiReportColorProductSwap.ps1
      - .github/workflows/r09-report-color-promotion.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r09-report-color-promotion
  cancel-in-progress: true

jobs:
  promote:
    name: Route DECRQTSR and DECAC through Rust
    runs-on: windows-2025
    steps:
      - name: Checkout candidate base
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify remote branch has not moved
        shell: pwsh
        run: |
          $expected = '${{ github.sha }}'
          $remote = (git ls-remote origin 'refs/heads/rust/r09-product-integration').Split("`t")[0]
          if ($remote -ne $expected) {
            throw "Remote branch moved before promotion. Expected $expected, found $remote."
          }

      - name: Prepare Rust ownership candidate
        shell: pwsh
        run: .\tools\rust\Invoke-R09CsiReportColorProductSwap.ps1

      - name: Validate candidate diff
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

          $engine = Get-Content -Raw 'src\terminal\parser\OutputStateMachineEngine.cpp'
          foreach ($required in @(
            'terminal_parser_ffi_output_csi_decrqtsr_plan(',
            'TERMINAL_PARSER_FFI_OUTPUT_CSI_DECRQTSR_REPORT_FORMAT_OMITTED',
            'terminal_parser_ffi_output_csi_decac_plan(',
            'static_cast<DispatchTypes::ColorItem>(decacPlan.item)'
          )) {
            if (-not $engine.Contains($required)) { throw "Missing routed marker: $required" }
          }
          foreach ($legacy in @(
            'case CsiActionCodes::DECRQTSR_RequestTerminalStateReport:',
            'case CsiActionCodes::DECAC_AssignColor:'
          )) {
            if ($engine.Contains($legacy)) { throw "Legacy ownership remains: $legacy" }
          }

          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'src/terminal/parser/OutputStateMachineEngine.cpp') {
            throw "Promotion candidate changed unexpected files: $($changed -join ', ')"
          }

      - name: Commit ownership route locally
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'src/terminal/parser/OutputStateMachineEngine.cpp'
          git commit -m 'Route CSI report and color through Rust'

      - name: Canonical product build
        shell: pwsh
        run: |
          Import-Module .\tools\OpenConsole.psm1
          Set-MsBuildDevEnvironment
          Invoke-OpenConsoleBuild -Platform x64 -Configuration Debug -Targets 'Terminal\CascadiaPackage'

      - name: Verify remote branch still has not moved
        shell: pwsh
        run: |
          $expected = '${{ github.sha }}'
          $remote = (git ls-remote origin 'refs/heads/rust/r09-product-integration').Split("`t")[0]
          if ($remote -ne $expected) {
            throw "Remote branch moved during product certification. Expected $expected, found $remote."
          }

      - name: Publish certified ownership route
        shell: pwsh
        run: git push origin HEAD:rust/r09-product-integration
