name: Rust CI

on:
  push:
    branches:
      - "rust/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/**"
      - "tools/rust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/**"
      - "tools/rust/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r01c-format-fix:
    name: R01c canonical format
    if: github.event_name == 'pull_request' && github.head_ref == 'rust/r01-output-engine' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rust/r01-output-engine
      - name: Tighten contract assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("rust/terminal-parser/src/output_engine.rs")
          text = path.read_text()

          dcs_start = text.index("    #[test]\n    fn dcs_support_is_negotiated_by_the_rust_dispatch_boundary() {")
          dcs_end = text.index("    #[test]\n    fn unsupported_sequences_report_unknown_without_panicking() {", dcs_start)
          dcs_lines = [
              "    #[test]",
              "    fn dcs_support_is_negotiated_by_the_rust_dispatch_boundary() {",
              "        let dispatch = RecordingDispatch {",
              "            accept_dcs: true,",
              "            ..RecordingDispatch::default()",
              "        };",
              "        let mut machine = StateMachine::new(OutputStateMachineEngine::new(dispatch));",
              "        machine.process_str(\"\\u{1b}P1;2;3qabc\\u{1b}\\\\\");",
              "        let recorded = actions(&machine);",
              "        let OutputAction::DcsBegin(DcsAction::DefineSixelImage(parameters)) = &recorded[0] else {",
              "            panic!(\"expected SIXEL DCS begin action\");",
              "        };",
              "        assert_eq!(parameters.values(), &[Some(1), Some(2), Some(3)]);",
              "        assert!(parameters.sub_params_for(0).is_empty());",
              "        assert!(parameters.sub_params_for(1).is_empty());",
              "        assert!(parameters.sub_params_for(2).is_empty());",
              "        assert_eq!(",
              "            &recorded[1..],",
              "            [",
              "                OutputAction::DcsPut(u16::from(b'a')),",
              "                OutputAction::DcsPut(u16::from(b'b')),",
              "                OutputAction::DcsPut(u16::from(b'c')),",
              "                OutputAction::DcsPut(0x1b),",
              "            ]",
              "        );",
              "    }",
              "",
          ]
          text = text[:dcs_start] + "\n".join(dcs_lines) + "\n" + text[dcs_end:]

          sgr_start = text.index("    #[test]\n    fn subparameters_are_accepted_only_for_the_cpp_compatible_sequences() {")
          sgr_end = text.rfind("\n}")
          sgr_lines = [
              "    #[test]",
              "    fn subparameters_are_accepted_only_for_the_cpp_compatible_sequences() {",
              "        let mut machine = machine();",
              "        machine.process_str(\"\\u{1b}[1:2A\\u{1b}[38:2:1:2:3m\");",
              "        let recorded = actions(&machine);",
              "        assert_eq!(recorded.len(), 1);",
              "        let OutputAction::SetGraphicsRendition(parameters) = &recorded[0] else {",
              "            panic!(\"expected SGR dispatch\");",
              "        };",
              "        assert_eq!(parameters.values(), &[Some(38)]);",
              "        assert_eq!(",
              "            parameters.sub_params_for(0),",
              "            &[Some(2), Some(1), Some(2), Some(3)]",
              "        );",
              "    }",
          ]
          text = text[:sgr_start] + "\n".join(sgr_lines) + text[sgr_end:]
          path.write_text(text)
          PY
      - name: Canonical rustfmt
        run: cargo fmt --all
      - name: Verify terminal-parser
        run: cargo test -p terminal-parser --lib --locked
      - name: Commit canonical source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/terminal-parser/src/output_engine.rs
          git diff --cached --quiet && exit 0
          git commit -m "style(rust): format and tighten R01c contract tests"
          git push origin HEAD:rust/r01-output-engine

  quality:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-targets --locked

  contract-harness:
    name: TAEF harness self-test
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
      - name: Validate TAEF result parser
        shell: pwsh
        run: ./tools/rust/Test-TaefContract.ps1
