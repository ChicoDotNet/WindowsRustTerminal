name: Rust CI

on:
  push:
    branches:
      - "rust/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/**"
      - "tools/rust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/**"
      - "tools/rust/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spelling-cleanup:
    name: R02c spelling expectation cleanup
    if: github.event_name == 'pull_request' && github.head_ref == 'rust/r02-mouse-input' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rust/r02-mouse-input
      - name: Remove migrated expectations
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/actions/spelling/expect/expect.txt')
          remove = {'ALTGR', 'AZERTY', 'PSobject'}
          lines = path.read_text().splitlines()
          found = remove.intersection(lines)
          if found != remove:
              raise SystemExit(f'missing expected spelling entries: {sorted(remove - found)}')
          path.write_text('\n'.join(line for line in lines if line not in remove) + '\n')
      - name: Commit spelling cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/actions/spelling/expect/expect.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(spelling): migrate Rust terms out of expect list"
          git push origin HEAD:rust/r02-mouse-input

  quality:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-targets --locked

  contract-harness:
    name: TAEF harness self-test
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
      - name: Validate TAEF result parser
        shell: pwsh
        run: ./tools/rust/Test-TaefContract.ps1
