name: Rust CI

on:
  push:
    branches:
      - "rust/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/**"
      - "tools/rust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/**"
      - "tools/rust/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spelling-verify:
    name: check-spelling canonical verification
    if: github.event_name == 'pull_request' && github.head_ref == 'rust/r02-mouse-input'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Check spelling
        uses: check-spelling/check-spelling@cfb6f7e75bbfc89c71eaa30366d0c166f1bd9c8c
        with:
          checkout: true
          check_file_names: 1
          spell_check_this: microsoft/terminal@main
          post_comment: 0
          use_magic_file: 1
          report-timing: 1
          allow-hunspell: false
          load-config-from: |
            {
              "pr-base-keys": [""],
              "pr-trusted-keys": ["check_extra_dictionaries", "dictionary_source_prefixes", "extra_dictionaries", ""],
              "": []
            }

  quality:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-targets --locked

  contract-harness:
    name: TAEF harness self-test
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
      - name: Validate TAEF result parser
        shell: pwsh
        run: ./tools/rust/Test-TaefContract.ps1
