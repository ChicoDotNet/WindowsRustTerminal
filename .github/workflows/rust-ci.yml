name: Rust CI

on:
  push:
    branches:
      - "rust/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/**"
      - "tools/rust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/**"
      - "tools/rust/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r03b-format:
    name: R03b rustfmt integration
    if: github.event_name == 'pull_request' && github.head_ref == 'rust/r03-sixel-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rust/r03-sixel-core
          fetch-depth: 0
      - name: Format MacroBuffer
        run: cargo fmt --all
      - name: Commit rustfmt output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/terminal-adapter/src/macro_buffer.rs
          git diff --cached --quiet && exit 0
          git commit -m "Format R03b MacroBuffer"
          git push origin HEAD:rust/r03-sixel-core

  quality:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-targets --locked

  contract-harness:
    name: TAEF harness self-test
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
      - name: Validate TAEF result parser
        shell: pwsh
        run: ./tools/rust/Test-TaefContract.ps1
