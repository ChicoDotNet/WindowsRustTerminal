name: Rust CI

on:
  push:
    branches:
      - "rust/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/**"
      - "tools/rust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust/**"
      - "tools/rust/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r01c-format-fix:
    name: R01c canonical format
    if: github.event_name == 'push' && github.ref_name == 'rust/r01-output-engine' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rust/r01-output-engine
      - name: Tighten contract assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("rust/terminal-parser/src/output_engine.rs")
          text = path.read_text()

          old_dcs = '''        assert_eq!(
              actions(&machine),
              [
                  OutputAction::DcsBegin(DcsAction::DefineSixelImage(Parameters::from_values(vec![Some(1), Some(2), Some(3)]))),
                  OutputAction::DcsPut(u16::from(b'a')),
                  OutputAction::DcsPut(u16::from(b'b')),
                  OutputAction::DcsPut(u16::from(b'c')),
                  OutputAction::DcsPut(0x1b),
              ]
          );'''
          new_dcs = '''        let recorded = actions(&machine);
          let OutputAction::DcsBegin(DcsAction::DefineSixelImage(parameters)) = &recorded[0] else {
              panic!("expected SIXEL DCS begin action");
          };
          assert_eq!(parameters.values(), &[Some(1), Some(2), Some(3)]);
          assert!(parameters.sub_params_for(0).is_empty());
          assert!(parameters.sub_params_for(1).is_empty());
          assert!(parameters.sub_params_for(2).is_empty());
          assert_eq!(
              &recorded[1..],
              [
                  OutputAction::DcsPut(u16::from(b'a')),
                  OutputAction::DcsPut(u16::from(b'b')),
                  OutputAction::DcsPut(u16::from(b'c')),
                  OutputAction::DcsPut(0x1b),
              ]
          );'''

          old_sgr = '''        assert_eq!(
              actions(&machine),
              [OutputAction::SetGraphicsRendition(Parameters::from_values(vec![Some(38)]))]
          );'''
          new_sgr = '''        let recorded = actions(&machine);
          assert_eq!(recorded.len(), 1);
          let OutputAction::SetGraphicsRendition(parameters) = &recorded[0] else {
              panic!("expected SGR dispatch");
          };
          assert_eq!(parameters.values(), &[Some(38)]);
          assert_eq!(
              parameters.sub_params_for(0),
              &[Some(2), Some(1), Some(2), Some(3)]
          );'''

          if old_dcs not in text:
              raise SystemExit("DCS assertion block not found")
          if old_sgr not in text:
              raise SystemExit("SGR assertion block not found")

          path.write_text(text.replace(old_dcs, new_dcs, 1).replace(old_sgr, new_sgr, 1))
          PY
      - name: Canonical rustfmt
        run: cargo fmt --all
      - name: Verify terminal-parser
        run: cargo test -p terminal-parser --lib --locked
      - name: Commit canonical source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/terminal-parser/src/output_engine.rs
          git diff --cached --quiet && exit 0
          git commit -m "style(rust): format and tighten R01c contract tests"
          git push origin HEAD:rust/r01-output-engine

  quality:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-targets --locked

  contract-harness:
    name: TAEF harness self-test
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
      - name: Validate TAEF result parser
        shell: pwsh
        run: ./tools/rust/Test-TaefContract.ps1
